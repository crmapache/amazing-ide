<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Окно грузит только свои скрипты и стили. Всё внешнее (сайты, картинки из сети)
      сюда не попадает: ссылки открываются в браузере, данные приходят через IPC.
      'unsafe-inline' у стилей - для динамических значений вроде ширины панели при
      перетаскивании, скриптов это не касается.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:" />
    <title>Amazing IDE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app/main.tsx"></script>
  </body>
</html>
